<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Test Page</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
  }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
  }
  p {
    font-size: 1.1rem;
    opacity: 0.85;
  }
  .card {
    background: rgba(255, 255, 255, 0.1);
    padding: 2rem 3rem;
    border-radius: 12px;
    backdrop-filter: blur(4px);
  }
  button {
    margin-top: 1rem;
    padding: 0.6rem 1.2rem;
    border: none;
    border-radius: 6px;
    background: #ffcc00;
    color: #1e3c72;
    font-weight: bold;
    cursor: pointer;
  }
  #counter {
    font-size: 1.5rem;
    margin-top: 0.5rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Hello, it works!</h1>
    <p>This page is hosted and rendering correctly.</p>
    <div id="counter">Clicks: 0</div>
    <button onclick="increment()">Click me</button>
  </div>

  <script>
    let count = 0;
    function increment() {
      count++;
      document.getElementById('counter').textContent = 'Clicks: ' + count;
    }
  </script>
</body>
</html>
